<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360, initial-scale=1.0">
  <title>PromptVault Sidebar</title>
  <link rel="stylesheet" href="sidebar.css">
  <style>
    /* Reset & base for the iframe document */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
    }
    /* Scrollbar styling for pv-list inside iframe */
    #pv-sidebar .pv-list::-webkit-scrollbar { width: 5px; }
    #pv-sidebar .pv-list::-webkit-scrollbar-track { background: transparent; }
    #pv-sidebar .pv-list::-webkit-scrollbar-thumb {
      background: var(--pv-scrollbar, #d0d0d0);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <!-- Toggle Button -->
  <button id="pv-sidebar-toggle" title="Toggle PromptVault">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="9" y1="3" x2="9" y2="21"></line>
    </svg>
  </button>

  <!-- Overlay -->
  <div id="pv-sidebar-overlay" class="pv-hidden"></div>

  <!-- Sidebar Panel -->
  <div id="pv-sidebar" class="pv-hidden">
    <div class="pv-header">
      <div class="pv-header-left">
        <span class="pv-logo">PromptVault</span>
      </div>
      <div class="pv-header-actions">
        <button class="pv-icon-btn" id="pv-theme-toggle" title="Toggle theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button class="pv-icon-btn" id="pv-close-sidebar" title="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <div class="pv-search">
      <div class="pv-search-wrapper">
        <svg class="pv-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="pv-search-input" placeholder="Search prompts...">
      </div>
    </div>

    <div class="pv-tabs">
      <div class="pv-tabs-left">
        <button class="pv-tab pv-active" data-tab="all">All</button>
        <button class="pv-tab" data-tab="recent">Recent</button>
        <button class="pv-tab" data-tab="pinned"><span class="pv-tab-icon"></span>Pinned</button>
      </div>
    </div>

    <div class="pv-list">
      <div class="pv-loading">
        <div class="pv-spinner"></div>
        Loading...
      </div>
    </div>

    <div class="pv-sidebar-footer">
      <div class="pv-footer-shortcut" id="pv-footer-shortcut">
        <span class="pv-footer-hint">Shortcut</span>
        <code class="pv-footer-kbd" id="pv-footer-kbd">Ctrl + Shift + P</code>
        <button class="pv-footer-copy" id="pv-copy-shortcut" title="Copy shortcut">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="storage.js"></script>
  <script src="sidebar-frame.js"></script>
</body>
</html>
