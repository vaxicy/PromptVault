<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptVault</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1 class="logo">PromptVault</h1>
      </div>
      <div class="header-right">
        <button id="btn-settings" class="icon-btn" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <button id="btn-theme" class="icon-btn" title="Toggle Theme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Search Bar -->
    <div class="search-container">
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search prompts..." autocomplete="off">
        <button id="btn-clear-search" class="clear-btn hidden">×</button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="nav-tab active" data-tab="prompts">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
        Prompts
      </button>
      <button class="nav-tab" data-tab="folders">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        Folders
      </button>
      <button class="nav-tab" data-tab="tags">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
          <line x1="7" y1="7" x2="7.01" y2="7"></line>
        </svg>
        Tags
      </button>
      <button class="nav-tab" data-tab="favorites">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        Favorites
      </button>
    </nav>

    <!-- Content Area -->
    <div class="content-area">
      <!-- Prompts Tab -->
      <div id="tab-prompts" class="tab-content active">
        <div class="tab-header">
          <h2>All Prompts</h2>
          <div class="tab-header-actions">
            <button id="btn-batch-manage" class="secondary-btn" title="Batch Manage">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 11 12 14 22 4"></polyline>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
              </svg>
              Batch
            </button>
            <button id="btn-new-prompt" class="primary-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              New Prompt
            </button>
          </div>
        </div>
        <div id="prompts-list" class="items-list"></div>
        <div id="prompts-empty" class="empty-state hidden">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          <p>No prompts yet</p>
          <p class="empty-hint">Create your first prompt to get started</p>
        </div>
        <!-- Batch Actions Bar -->
        <div id="batch-actions-bar" class="batch-actions-bar hidden">
          <span id="batch-selected-count">0 selected</span>
          <div class="batch-actions-right">
            <select id="batch-folder-select">
              <option value="">Move to folder...</option>
            </select>
            <button id="btn-batch-move" class="primary-btn" disabled>Move</button>
            <button id="btn-batch-cancel" class="secondary-btn">Cancel</button>
          </div>
        </div>
      </div>

      <!-- Folders Tab -->
      <div id="tab-folders" class="tab-content">
        <div class="tab-header">
          <h2>Folders</h2>
          <button id="btn-new-folder" class="primary-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            New Folder
          </button>
        </div>
        <div id="folders-list" class="items-list"></div>
      </div>

      <!-- Tags Tab -->
      <div id="tab-tags" class="tab-content">
        <div class="tab-header">
          <h2>Tags</h2>
          <button id="btn-new-tag" class="primary-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            New Tag
          </button>
        </div>
        <div id="tags-list" class="tags-cloud"></div>
      </div>

      <!-- Favorites Tab -->
      <div id="tab-favorites" class="tab-content">
        <div class="tab-header">
          <h2>Favorite Prompts</h2>
        </div>
        <div id="favorites-list" class="items-list"></div>
        <div id="favorites-empty" class="empty-state hidden">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
          <p>No favorites yet</p>
          <p class="empty-hint">Mark prompts as favorite to see them here</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Prompt Editor Modal -->
  <div id="prompt-modal" class="modal hidden">
    <div class="modal-content large">
      <div class="modal-header">
        <h2 id="prompt-modal-title">New Prompt</h2>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="prompt-title">Prompt Name</label>
          <input type="text" id="prompt-title" placeholder="Enter prompt name..." maxlength="100">
        </div>
        <div class="form-group">
          <label for="prompt-content">Prompt Content</label>
          <textarea id="prompt-content" placeholder="Enter your prompt content..." rows="8"></textarea>
        </div>
        <div class="form-group">
          <label for="prompt-folder">Folder</label>
          <select id="prompt-folder">
            <option value="default">Default</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tags</label>
          <div id="tag-suggestions" class="tag-suggestions"></div>
          <div class="tags-input-container">
            <div id="prompt-tags" class="tags-list"></div>
            <input type="text" id="prompt-tag-input" placeholder="Add tag..." maxlength="30">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="secondary-btn modal-cancel">Cancel</button>
        <button id="btn-save-prompt" class="primary-btn">Save</button>
      </div>
    </div>
  </div>

  <!-- Folder Editor Modal -->
  <div id="folder-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="folder-modal-title">New Folder</h2>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="folder-name">Name</label>
          <input type="text" id="folder-name" placeholder="Enter folder name..." maxlength="50">
        </div>
        <div class="form-group">
          <label for="folder-color">Color</label>
          <div class="color-picker">
            <input type="color" id="folder-color" value="#4A90E2">
            <div class="color-presets">
              <button class="color-preset" data-color="#4A90E2" style="background:#4A90E2"></button>
              <button class="color-preset" data-color="#50C878" style="background:#50C878"></button>
              <button class="color-preset" data-color="#FF6B6B" style="background:#FF6B6B"></button>
              <button class="color-preset" data-color="#FFA500" style="background:#FFA500"></button>
              <button class="color-preset" data-color="#9B59B6" style="background:#9B59B6"></button>
              <button class="color-preset" data-color="#1ABC9C" style="background:#1ABC9C"></button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="secondary-btn modal-cancel">Cancel</button>
        <button id="btn-save-folder" class="primary-btn">Save Folder</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="setting-default-folder">Default Folder</label>
          <select id="setting-default-folder">
            <option value="default">Default</option>
          </select>
        </div>
        <div class="form-group">
          <label for="setting-language">Language</label>
          <select id="setting-language">
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="form-group">
          <button id="btn-clear-data" class="danger-btn">Clear All Data</button>
        </div>
        <div class="settings-section">
          <h3 data-i18n="data_management">Data Management</h3>
          <div class="data-actions">
            <button id="btn-import" class="secondary-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span data-i18n="btn_import">Import</span>
            </button>
            <button id="btn-export" class="secondary-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <span data-i18n="btn_export">Export</span>
            </button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="secondary-btn modal-cancel">Close</button>
      </div>
    </div>
  </div>

  <!-- Confirm Dialog -->
  <div id="confirm-dialog" class="modal hidden">
    <div class="modal-content small">
      <div class="modal-header">
        <h2 id="confirm-title">Confirm</h2>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <p id="confirm-message">Are you sure?</p>
      </div>
      <div class="modal-footer">
        <button class="secondary-btn modal-cancel">Cancel</button>
        <button id="confirm-ok" class="danger-btn">Confirm</button>
      </div>
    </div>
  </div>

  <!-- New Tag Dialog -->
  <div id="tag-modal" class="modal hidden">
    <div class="modal-content small">
      <div class="modal-header">
        <h2 id="tag-modal-title">New Tag</h2>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="tag-input" id="tag-input-label">Tag Name</label>
          <input type="text" id="tag-input" placeholder="Enter tag name..." maxlength="30" autocomplete="off">
        </div>
      </div>
      <div class="modal-footer">
        <button class="secondary-btn modal-cancel">Cancel</button>
        <button id="btn-save-tag" class="primary-btn">Create</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden"></div>

  <script src="i18n.js"></script>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
