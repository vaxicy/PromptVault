<!DOCTYPE html>
<html>
<head>
  <title>PromptVault Icon Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #1a1a2e;
      color: white;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: #4a9eff; }
    .icon-preview {
      display: inline-block;
      margin: 20px;
      text-align: center;
    }
    canvas {
      border: 2px solid #4a9eff;
      margin: 10px;
      background: white;
    }
    button {
      padding: 12px 24px;
      background: #4a9eff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 10px;
      font-size: 14px;
      font-weight: bold;
    }
    button:hover { background: #3585e8; }
    .instructions {
      background: #16213e;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
      line-height: 1.6;
    }
    .download-all {
      background: #50C878;
      font-size: 16px;
      padding: 15px 30px;
    }
  </style>
</head>
<body>
  <h1>🔷 PromptVault Icon Generator</h1>

  <div class="instructions">
    <h3>Instructions:</h3>
    <ol>
      <li>Click "Generate All Icons" to create the icon designs</li>
      <li>Click "Download All Icons" to save the PNG files</li>
      <li>Place the downloaded icons in the <code>icons/</code> folder of your extension</li>
    </ol>
  </div>

  <button onclick="generateAll()">Generate All Icons</button>
  <button class="download-all" onclick="downloadAll()">Download All Icons</button>

  <div style="margin-top: 30px;">
    <div class="icon-preview">
      <canvas id="icon16" width="16" height="16"></canvas>
      <div>16x16</div>
    </div>
    <div class="icon-preview">
      <canvas id="icon48" width="48" height="48"></canvas>
      <div>48x48</div>
    </div>
    <div class="icon-preview">
      <canvas id="icon128" width="128" height="128"></canvas>
      <div>128x128</div>
    </div>
  </div>

  <script>
    function generateAll() {
      generateIcon('icon16', 16);
      generateIcon('icon48', 48);
      generateIcon('icon128', 128);
    }

    function generateIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      // Clear canvas
      ctx.clearRect(0, 0, size, size);

      // Background with rounded corners
      const radius = size * 0.15;
      ctx.fillStyle = '#4a9eff';
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fill();

      // White document shape
      const padding = size * 0.2;
      const docWidth = size - padding * 2;
      const docHeight = size - padding * 2;

      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.roundRect(padding, padding, docWidth, docHeight, size * 0.05);
      ctx.fill();

      // Document lines
      ctx.fillStyle = '#4a9eff';
      const lineHeight = Math.max(1, size * 0.06);
      const linePadding = size * 0.1;
      const lineWidth = docWidth - linePadding * 2;

      for (let i = 0; i < 3; i++) {
        const y = padding + size * 0.2 + i * size * 0.15;
        const width = lineWidth * (1 - i * 0.15);
        ctx.fillRect(padding + linePadding, y, width, lineHeight);
      }

      // Add "PV" text for larger icons
      if (size >= 48) {
        ctx.fillStyle = '#4a9eff';
        ctx.font = `bold ${size * 0.2}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('PV', size / 2, size * 0.85);
      }
    }

    function downloadAll() {
      downloadCanvas('icon16', 'icon16.png');
      downloadCanvas('icon48', 'icon48.png');
      downloadCanvas('icon128', 'icon128.png');
      alert('All icons downloaded! Move them to the icons/ folder.');
    }

    function downloadCanvas(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Auto-generate on load
    window.onload = () => {
      generateAll();
    };
  </script>
</body>
</html>
